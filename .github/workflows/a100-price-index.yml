name: A100 GPU Price Index Pipeline

on:
  schedule:
    - cron: '0 */4 * * *'  # Runs every 4 hours
  workflow_dispatch:
    # Allow manual trigger

concurrency:
  group: a100-cuoracle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome for Selenium
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run all A100 scrapers
        run: python run_all_a100_scrapers.py
        timeout-minutes: 30

      - name: Calculate A100 index
        run: python calculate_a100_index.py

      - name: Push to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python push_to_supabase.py

      - name: Push A100 index to ByteStrike CuOracle
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          SEPOLIA_FALLBACK_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
          ORACLE_UPDATER_PRIVATE_KEY: ${{ secrets.ORACLE_UPDATER_PRIVATE_KEY }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CU_ORACLE_ADDRESS: ${{ secrets.CU_ORACLE_ADDRESS }}
          ORACLE_REVEAL_WAIT_SECONDS: "3"
        run: |
          PRICE=$(python -c "import json; print(json.load(open('a100_weighted_index.json'))['final_index_price'])")
          echo "A100 Weighted Index Price: \$${PRICE}/hr"
          python push_to_contract.py --price "$PRICE"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-data
          path: |
            a100_combined_prices.json
            a100_weighted_index.json
            a100_oracle_update_log.json
          retention-days: 30
